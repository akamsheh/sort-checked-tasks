name: CI

on:
    # Feature branches are covered by pull_request, so pushes only run on the
    # integration branches. Otherwise every push to a branch with an open PR
    # would run the whole suite twice.
    push:
        branches: [main, master]
    pull_request:
    # "latest" in wdio.conf.mts resolves at run time, so a new Obsidian release
    # can break the plugin without any commit of ours. A weekly run surfaces
    # that here instead of in a user's bug report.
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  # The plugin is bundled by esbuild and runs in Obsidian's
                  # Electron runtime, never in Node, so the Node version has no
                  # effect on the shipped main.js. This matches release.yml,
                  # which is the build users actually install.
                  node-version: 24.x
                  cache: "npm"
            - run: npm ci
            - run: npm run build
            - run: npm run lint
            - run: npm run format:check
            - run: npm test

    # Runs the plugin inside real Obsidian builds via wdio-obsidian-service.
    # "earliest" resolves to manifest.json's minAppVersion and "latest" to the
    # newest public release, so a green run backs the "tested on" claim for the
    # full supported range.
    e2e:
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: "npm"
            - run: npm ci
            - run: npm run build

            - name: Resolve Obsidian versions for cache key
              run: |
                  npx tsx wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
                  rm -rf .obsidian-cache

            - name: Cache Obsidian downloads
              uses: actions/cache@v4
              with:
                  path: .obsidian-cache
                  # restore-keys lets a bumped "latest" reuse the already
                  # downloaded "earliest" build instead of starting cold.
                  key: obsidian-cache-${{ runner.os }}-${{ hashFiles('obsidian-versions-lock.txt') }}
                  restore-keys: |
                      obsidian-cache-${{ runner.os }}-

            - name: Set up virtual display
              run: |
                  sudo apt-get update -q
                  sudo apt-get install -q -y herbstluftwm x11-xserver-utils
                  export DISPLAY=:99
                  echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
                  Xvfb $DISPLAY -screen 0 1280x1024x24 +extension GLX -noreset &
                  sleep 1
                  herbstluftwm &
                  sleep 1

            - name: Run e2e tests
              run: npm run test:e2e
              env:
                  WDIO_MAX_INSTANCES: "2"

    # The pinned "obsidian" typings match manifest.json's minAppVersion, so the
    # normal build proves backward compatibility. This job type-checks against
    # the newest API to catch upcoming deprecations before they ship.
    typecheck-latest-api:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: "npm"
            - run: npm ci
            - run: npm install --no-save obsidian@latest
            - run: npx tsc -noEmit -skipLibCheck
