name: CI

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]

jobs:
    build:
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [20.x, 22.x, 24.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v6
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
            - run: npm ci
            - run: npm run build --if-present
            - run: npm run lint
            - run: npm test

    # Runs the plugin inside real Obsidian builds via wdio-obsidian-service.
    # "earliest" resolves to manifest.json's minAppVersion and "latest" to the
    # newest public release, so a green run backs the "tested on" claim for the
    # full supported range.
    e2e:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: "npm"
            - run: npm ci
            - run: npm run build

            - name: Resolve Obsidian versions for cache key
              run: |
                  npx tsx wdio.conf.mts | grep 'obsidian-cache-key:' > obsidian-versions-lock.txt
                  rm -rf .obsidian-cache
              env:
                  CI: "true"

            - name: Cache Obsidian downloads
              uses: actions/cache@v4
              with:
                  path: .obsidian-cache
                  key: obsidian-cache-${{ hashFiles('obsidian-versions-lock.txt') }}

            - name: Set up virtual display
              run: |
                  sudo apt-get update -q
                  sudo apt-get install -q -y herbstluftwm x11-xserver-utils
                  export DISPLAY=:99
                  echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
                  Xvfb $DISPLAY -screen 0 1280x1024x24 +extension GLX -noreset &
                  sleep 1
                  herbstluftwm &
                  sleep 1

            - name: Run e2e tests
              run: npm run test:e2e
              env:
                  WDIO_MAX_INSTANCES: "2"

    # The pinned "obsidian" typings match manifest.json's minAppVersion, so the
    # normal build proves backward compatibility. This job type-checks against
    # the newest API to catch upcoming deprecations before they ship.
    typecheck-latest-api:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v6
              with:
                  node-version: 24.x
                  cache: "npm"
            - run: npm ci
            - run: npm install --no-save obsidian@latest
            - run: npx tsc -noEmit -skipLibCheck
